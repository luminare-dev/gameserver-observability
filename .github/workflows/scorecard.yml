# Caller: OpenSSF Scorecard once a week, on pushes to main and when branch protection changes.
# GitHub disables scheduled workflows in public repositories after 60 days without activity;
# check the Actions tab once a month (PUBLISHING.md, maintenance).
name: scorecard

on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    # Private repositories (part A of PUBLISHING.md, until the gate passes) are skipped: the action
    # and the code-scanning upload need GitHub Advanced Security there.
    needs: visibility
    if: ${{ needs.visibility.outputs.private == 'false' }}
    uses: ./.github/workflows/reusable-scorecard.yml
    permissions:
      contents: read           # read the repository
      actions: read            # read workflow runs for the checks
      security-events: write   # upload the SARIF file to code scanning
      id-token: write          # sign the published results

  visibility:
    # The payload of a scheduled run carries no repository, so "github.event.repository.private" is
    # empty there and cannot skip a private repository. This job asks the API on every trigger.
    name: visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read   # read the repository's own settings (its visibility)
    outputs:
      private: ${{ steps.repo.outputs.private }}
    steps:
      - name: Is the repository private?
        id: repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          echo "private=$private" >> "$GITHUB_OUTPUT"
