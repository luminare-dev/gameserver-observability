# Reusable OpenSSF Scorecard analysis with SARIF upload to code scanning.
#
# With publish_results the Scorecard API enforces workflow rules (README of
# ossf/scorecard-action v2.4.4, checked 2026-10-06): no top-level env or defaults, no
# workflow-level write permissions, id-token: write only in the Scorecard job, no job env,
# defaults, containers or services, an Ubuntu GitHub-hosted runner, and only these steps:
# actions/checkout, actions/upload-artifact, github/codeql-action/upload-sarif,
# ossf/scorecard-action, step-security/harden-runner. Keep this file inside those rules.
name: reusable-scorecard

on:
  workflow_call:
    inputs:
      publish-results:
        description: Publish to the Scorecard API (needed for the README badge). Ignored for private repositories.
        type: boolean
        default: true

permissions: {}

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read           # read the repository
      actions: read            # read workflow runs for the checks
      security-events: write   # upload the SARIF file to code scanning
      id-token: write          # sign the published results (publish_results)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}

      - name: Keep the SARIF file for 5 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
