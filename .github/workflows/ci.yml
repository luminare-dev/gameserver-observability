# Caller: lint, tests and the full-history secret scan on every pull request and push to main.
# Required checks for the main ruleset: "ci / lint-test" and "secrets / gitleaks".
# The "promtool" job checks the pack's Prometheus rules (scripts/check_promtool.sh) and its
# scrape and exporter configs (scripts/check_pack.py, with promtool check config). The
# "exporters" job scrapes the fake game server through Prometheus, json_exporter and
# blackbox_exporter with the pack's configs (scripts/smoke_exporters.py).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Superseded pull request runs are cancelled. Each commit on main gets its own group, so it
  # always keeps its CI result (a shared group would still drop all but the newest pending run).
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml
    permissions:
      contents: read
    with:
      # Same command as release.yml (tests/test_pack_repo.py checks that).
      test-command: bash scripts/test.sh

  secrets:
    uses: ./.github/workflows/reusable-gitleaks.yml
    permissions:
      contents: read

  promtool:
    name: promtool
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Official Prometheus release tarball; sha256 from the release's sha256sums.txt
      # (docs/toolchain.md, verified 2026-10-21). Dependabot does not see this pin: bump by hand.
      PROMTOOL_VERSION: 3.15.0
      PROMTOOL_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install promtool (sha256-pinned)
        run: |
          set -euo pipefail
          name="prometheus-${PROMTOOL_VERSION}.linux-amd64"
          archive="$RUNNER_TEMP/${name}.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMTOOL_VERSION}/${name}.tar.gz"
          echo "${PROMTOOL_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "${name}/promtool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check and test the rules
        run: bash scripts/check_promtool.sh

      - name: Check the scrape and exporter configs
        run: python3 scripts/check_pack.py --require-promtool

  exporters:
    name: exporters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Official release tarballs; each sha256 is from that release's sha256sums.txt
      # (docs/toolchain.md, verified 2026-10-21). Dependabot does not see these pins: bump by hand.
      # Prometheus is the same tarball as in the promtool job (tests/test_pack_repo.py checks it).
      PROMETHEUS_VERSION: 3.15.0
      PROMETHEUS_SHA256: 2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0
      JSON_EXPORTER_VERSION: 0.8.0
      JSON_EXPORTER_SHA256: bd25fe58f62cec131b2ecbe859358990bb07f0266439ddcdef501fdd182a4fe1
      BLACKBOX_EXPORTER_VERSION: 0.29.0
      BLACKBOX_EXPORTER_SHA256: 5512929259bb6164f68ebe20ce433ec43b8609e3a79c95324f5020e931488fb4
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Prometheus, json_exporter and blackbox_exporter (sha256-pinned)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          install_tool() {  # <name> <version> <sha256> <URL of the release downloads>
            local folder="$1-$2.linux-amd64"
            local archive="$RUNNER_TEMP/$folder.tar.gz"
            curl -fsSL -o "$archive" "$4/v$2/$folder.tar.gz"
            echo "$3  $archive" | sha256sum -c -
            tar -xzf "$archive" -C "$bin" --strip-components=1 "$folder/$1"
          }
          install_tool prometheus "$PROMETHEUS_VERSION" "$PROMETHEUS_SHA256" \
            https://github.com/prometheus/prometheus/releases/download
          install_tool json_exporter "$JSON_EXPORTER_VERSION" "$JSON_EXPORTER_SHA256" \
            https://github.com/prometheus-community/json_exporter/releases/download
          install_tool blackbox_exporter "$BLACKBOX_EXPORTER_VERSION" "$BLACKBOX_EXPORTER_SHA256" \
            https://github.com/prometheus/blackbox_exporter/releases/download
          echo "$bin" >> "$GITHUB_PATH"

      - name: Scrape the fake game server through the exporters
        run: python3 scripts/smoke_exporters.py
