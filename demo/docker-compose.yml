# Demo stack: the pack's scrape jobs, exporter modules, rules and dashboard, run against the
# bundled simulated game server (demo/fake-fxserver/fake_fxserver.py) on this machine. Every value
# it shows is synthetic data from that simulated server: there is no game server and there are no
# players. docs/demo.md describes the stack, the load spike and the checks.
#
#   docker compose -f demo/docker-compose.yml up -d
#   then open http://127.0.0.1:3000/ (the dashboard "Game server overview", no login)
#   docker compose -f demo/docker-compose.yml down -v
#
# All services share one network namespace, as if they ran on one host, so the pack's files are
# used as shipped: the scrape jobs reach the simulated server and the exporters on 127.0.0.1, and
# the Grafana data source reaches Prometheus as prometheus:9090. Prometheus owns the namespace, so
# the simulated server can be stopped and started on its own. Only Grafana, Prometheus and the
# simulated server are published, on 127.0.0.1 of the Docker host; other host ports can be set
# with GSO_DEMO_GRAFANA_PORT, GSO_DEMO_PROMETHEUS_PORT and GSO_DEMO_GAME_PORT. Every image is pinned
# by digest to the versions that CI tests (tests/test_demo.py).
name: gameserver-observability-demo

services:
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - 127.0.0.1:${GSO_DEMO_GRAFANA_PORT:-3000}:3000
      - 127.0.0.1:${GSO_DEMO_PROMETHEUS_PORT:-9090}:9090
      - 127.0.0.1:${GSO_DEMO_GAME_PORT:-30120}:30120
    volumes:
      - ../prometheus/prometheus.demo.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/scrape/fxserver.yml:/etc/prometheus/scrape/fxserver.yml:ro
      - ../rules:/etc/prometheus/rules:ro
    configs:
      - source: perf_password
        target: /etc/prometheus/secrets/fxserver_perf

  # The simulated game server: synthetic data on the endpoints the pack reads, /perf/ behind
  # basic auth, and the load knob on /fake/control (docs/demo.md).
  fxserver:
    image: python:3.13-slim@sha256:cf50a4f6ac4f026458b08d5222023d700ac806410dff5e9ca8728fa44f2b850f
    network_mode: service:prometheus
    init: true
    user: "65534:65534"
    command:
      - python3
      - -I
      - /opt/fake-fxserver/fake_fxserver.py
      - --bind=0.0.0.0
      - --quiet
      - --perf-user=prometheus
      - --perf-password-file=/run/fake-fxserver/perf_password
    environment:
      FAKE_CLIENTS: "3"
      FAKE_MAX_CLIENTS: "32"
    volumes:
      - ./fake-fxserver/fake_fxserver.py:/opt/fake-fxserver/fake_fxserver.py:ro
    configs:
      - source: perf_password
        target: /run/fake-fxserver/perf_password

  json-exporter:
    # yamllint disable-line rule:line-length
    image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
    network_mode: service:prometheus
    init: true
    command:
      - --config.file=/etc/json_exporter/config.yml
      - --web.listen-address=127.0.0.1:7979
    volumes:
      - ../json_exporter/config.yml:/etc/json_exporter/config.yml:ro

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0@sha256:9613f2884689b6fad9f1939f6a3b0388c93a022cfaededb19545b329b5c83dea
    network_mode: service:prometheus
    init: true
    user: "65534:65534"
    command:
      - --config.file=/etc/blackbox_exporter/blackbox.yml
      - --web.listen-address=127.0.0.1:9115
    volumes:
      - ../blackbox/blackbox.yml:/etc/blackbox_exporter/blackbox.yml:ro

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    network_mode: service:prometheus
    environment:
      # No account at all: whoever can open the port sees the dashboards as a viewer, and nobody
      # can sign in or change anything.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # The dashboard is the home page. Usage reports, update checks, the news feed and plugin
      # preinstalls are off.
      # yamllint disable-line rule:line-length
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/gameserver-observability/game-server-overview.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    # The pack's provisioning files and dashboard, at the paths of docs/install.md#dashboards.
    volumes:
      - type: bind
        source: ../grafana/provisioning/datasources/gameserver-observability.yml
        target: /etc/grafana/provisioning/datasources/gameserver-observability.yml
        read_only: true
      - type: bind
        source: ../grafana/provisioning/dashboards/gameserver-observability.yml
        target: /etc/grafana/provisioning/dashboards/gameserver-observability.yml
        read_only: true
      - type: bind
        source: ../grafana/dashboards/game-server-overview.json
        target: /var/lib/grafana/dashboards/gameserver-observability/game-server-overview.json
        read_only: true

configs:
  # The /perf/ password of the simulated server, shared by it and Prometheus. It guards synthetic
  # data on ports that only 127.0.0.1 reaches; never use it for a real server.
  perf_password:
    content: synthetic-demo-only
