# promtool unit tests for FXServerTickTimeHigh (rules/fxserver.alerts.yml), which reads the
# svMain p95 of rules/fxserver.recording.yml.
#   promtool test rules tests/rules/tick.test.yml   (scripts/check_promtool.sh runs all)
#
# One sample every 15 s, as the pack scrapes /perf/. svMain runs 300 ticks per 15 s. Slow minutes:
# 150 ticks up to 30 ms, 250 up to 50 ms, 285 up to 70 ms, all up to 100 ms, so 15 % of the
# ticks take longer than 50 ms and the p95 is 70 ms. Healthy minutes: every tick up to 30 ms
# (p95 28.5 ms). promtool reports only firing alerts, so a pending alert is expected as [].
rule_files:
  - ../../rules/fxserver.recording.yml
  - ../../rules/fxserver.alerts.yml

evaluation_interval: 30s

tests:
  - name: svMain slow for 20 minutes fires after 5 minutes, only for that server
    interval: 15s
    input_series:
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.03"}
        values: '0+150x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.05"}
        values: '0+250x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.07"}
        values: '0+285x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.1"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="+Inf"}
        values: '0+300x80'
      # game-02 stays healthy.
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="192.0.2.11:30120", server="game-02",
          thread="svMain", le="0.03"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="192.0.2.11:30120", server="game-02",
          thread="svMain", le="+Inf"}
        values: '0+300x80'
    alert_rule_test:
      # Pending since the first p95 at 30 s: not firing before 5 minutes have passed.
      - eval_time: 3m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: FXServerTickTimeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              server: game-01
              thread: svMain
            exp_annotations:
              summary: "Main thread ticks are slow on game server game-01"
              description: >-
                For 5 minutes more than 5 % of the svMain ticks on game-01 have taken longer than
                50 ms (95th percentile over the last minute: 70ms). Scripts and events run late,
                and players notice lag.
              runbook_url:
                https://github.com/luminare-dev/gameserver-observability/blob/main/docs/runbook.md#alert-fxserverticktimehigh
      - eval_time: 20m
        alertname: FXServerTickTimeHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              server: game-01
              thread: svMain
            exp_annotations:
              summary: "Main thread ticks are slow on game server game-01"
              description: >-
                For 5 minutes more than 5 % of the svMain ticks on game-01 have taken longer than
                50 ms (95th percentile over the last minute: 70ms). Scripts and events run late,
                and players notice lag.
              runbook_url:
                https://github.com/luminare-dev/gameserver-observability/blob/main/docs/runbook.md#alert-fxserverticktimehigh

  - name: healthy svMain does not fire
    interval: 15s
    input_series:
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.03"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.05"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="+Inf"}
        values: '0+300x80'
    alert_rule_test:
      - eval_time: 10m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
      - eval_time: 20m
        alertname: FXServerTickTimeHigh
        exp_alerts: []

  - name: a 3-minute spike does not fire
    # Slow for the first 3 minutes (12 steps), then healthy: the one-minute p95 is above 50 ms
    # from 30 s to 3m30s, three minutes of pending, never 5.
    interval: 15s
    input_series:
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.03"}
        values: '0+150x12 2100+300x67'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.05"}
        values: '0+250x12 3300+300x67'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.07"}
        values: '0+285x12 3720+300x67'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.1"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="+Inf"}
        values: '0+300x80'
    alert_rule_test:
      - eval_time: 3m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
      - eval_time: 6m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
    promql_expr_test:
      # The spike is visible while it lasts, and gone a minute after it ended.
      - expr: round(server_thread:fxserver_tick_time_seconds:p95_1m, 0.000001)
        eval_time: 2m
        exp_samples:
          - labels: '{server="game-01", thread="svMain"}'
            value: 0.07
      - expr: round(server_thread:fxserver_tick_time_seconds:p95_1m, 0.000001)
        eval_time: 5m
        exp_samples:
          - labels: '{server="game-01", thread="svMain"}'
            value: 0.0285

  - name: slow svNetwork ticks do not fire, the alert is for svMain only
    # svNetwork with the slow distribution (scaled to 1500 ticks per 15 s), svMain healthy.
    interval: 15s
    input_series:
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svNetwork", le="0.03"}
        values: '0+750x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svNetwork", le="0.05"}
        values: '0+1250x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svNetwork", le="0.07"}
        values: '0+1425x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svNetwork", le="0.1"}
        values: '0+1500x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svNetwork", le="+Inf"}
        values: '0+1500x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="0.03"}
        values: '0+300x80'
      - series: >-
          fxserver_tick_time_seconds_bucket{job="fxserver_perf", instance="127.0.0.1:30120", server="game-01",
          thread="svMain", le="+Inf"}
        values: '0+300x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: FXServerTickTimeHigh
        exp_alerts: []
    promql_expr_test:
      - expr: round(server_thread:fxserver_tick_time_seconds:p95_1m{thread="svNetwork"}, 0.000001)
        eval_time: 15m
        exp_samples:
          - labels: '{server="game-01", thread="svNetwork"}'
            value: 0.07
